<script>
  // Send visitors to their language; anyone without JavaScript gets English via the refresh below.
  (function () {
    var langs = navigator.languages || [navigator.language || ''];
    var de = /^de\b/i.test(langs[0] || '');
    location.replace('../' + (de ? 'de' : 'en') + '/support/' + location.hash);
  })();
</script>
<meta http-equiv="refresh" content="0; url=../en/support/">
<link rel="icon" href="../assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="../assets/style.css">
</head>

</main>
</div>
</body>
</html>
